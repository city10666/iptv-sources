name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间早上 8:00 自动执行 (UTC 0:00)
  workflow_dispatch: # 允许你在页面上手动点击运行

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream
    runs-on: ubuntu-latest
    if: github.repository == 'city10666/iptv-sources' # 根据你的日志，这里已经帮你改好了

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4

      - name: Sync upstream changes
        id: sync
        uses: aormsby/fork-sync-action@v3.4 # 💡 这里已经修正为全小写
        with:
          upstream_repository: best-fan/iptv-sources
          upstream_branch: main
          target_branch: main
          target_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_pull_args: '-s recursive -X theirs'
